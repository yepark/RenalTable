name: PR 품질 검사

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: 정적 검사와 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
      - name: Node.js 24 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: lockfile로 설치
        run: npm ci
      - name: 비밀값 검사
        run: npm run secrets:check
      - name: 포맷 검사
        run: npm run format:check
      - name: 린트
        run: npm run lint
      - name: 타입 검사
        run: npm run typecheck
      - name: 단위·컴포넌트 테스트
        run: npm run test
      - name: 프로덕션 빌드
        run: npm run build

  smoke:
    name: Chromium smoke E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
      - name: Node.js 24 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: lockfile로 설치
        run: npm ci
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: smoke E2E
        run: npm run test:e2e
