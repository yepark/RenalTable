name: renaltable

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER를 .env에 설정해 주세요.}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정해 주세요.}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정해 주세요.}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - renaltable_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  renaltable_postgres:
